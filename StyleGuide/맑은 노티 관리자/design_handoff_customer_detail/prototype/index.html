<script>

    theme: {
      extend: {

          sans: ['"DM Sans"','"Pretendard Variable"','Pretendard','ui-sans-serif','system-ui','sans-serif'],

<style type="text/tailwindcss">
  @layer base {
    html, body { font-family: "DM Sans","Pretendard Variable",Pretendard,system-ui,sans-serif; letter-spacing: -0.01em; }
    body { @apply text-slate-900 bg-slate-50 text-sm; -webkit-font-smoothing: antialiased; }
    button:focus, [role="button"]:focus { outline: none; }
    [data-lucide] { width: 1em; height: 1em; }
  }
  @layer utilities {
    /* Nuxt UI-flavoured semantic helpers */
    .text-default   { @apply text-slate-900; }
    .text-muted     { @apply text-slate-500; }
    .text-toned     { @apply text-slate-600; }
    .text-dimmed    { @apply text-slate-400; }
    .text-highlighted { @apply text-slate-900 font-medium; }
    .bg-default     { @apply bg-white; }
    .bg-muted       { @apply bg-slate-50; }
    .bg-elevated    { @apply bg-slate-100; }
    .bg-accented    { @apply bg-slate-200; }
    .ring-default   { @apply ring-slate-200; }
    .border-default { @apply border-slate-200; }
    .divide-default > * + * { @apply border-slate-100; }
  }

  .scroll-thin::-webkit-scrollbar{width:8px;height:8px}
  .scroll-thin::-webkit-scrollbar-thumb{background:rgb(226 232 240);border-radius:999px}
