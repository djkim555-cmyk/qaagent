# QA 클라우드 뷰어 Worker — Cloudflare 배포 설정 (M1 에서 값 채움)
# 사내 STACK 표준: Hono on Workers + D1 + R2.
name = "qa-viewer"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# ── D1 (관계형 본체=조회 복제 + 트리아지 원장) ──
# M1 에서: wrangler d1 create qa-viewer-db → 출력된 database_id 를 아래에 붙인다.
[[d1_databases]]
binding = "DB"
database_name = "qa-viewer-db"
database_id = "c49bfbeb-2581-46af-8080-a0646ab6e2de"

# ── R2 (리포트 마크다운 + 스크린샷) ──
# ⚠ R2 미활성(계정에서 R2 활성화 후 주석 해제). 활성화: 대시보드 → R2 → Enable,
#    그 뒤: wrangler r2 bucket create qa-viewer-assets → 아래 주석 해제 → 재배포.
#    R2 없이도 D1 기반 조회/트리아지/동기화는 정상 동작(리포트·스크린샷 조회만 보류).
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "qa-viewer-assets"

[vars]
# Access 미설정 시 /api 접근 허용 여부. 운영 기본은 "false"(Access 로그인 필수 = fail-closed).
# 임시 공개 미리보기가 필요하면 운영자 승인하에 "true" 로 바꿔 재배포(누구나 조회+트리아지 가능 — 주의).
DEV_ALLOW_NO_ACCESS = "false"

# ── 시크릿(코드/설정에 값 금지) ──
# M1 에서: wrangler secret put SYNC_TOKEN   (로컬 동기화기와 공유하는 토큰)
#          (Access 가 S2/S3 인증을 담당하므로 뷰어용 별도 시크릿은 없음)

# 운영/스테이징 분리 예시:
# [env.production]
# vars = { DEV_ALLOW_NO_ACCESS = "false" }
