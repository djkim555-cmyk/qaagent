<div class="min-h-screen grid place-items-center px-4" style="background:radial-gradient(1200px 600px at 50% -10%, #eff6ff, #f8fafc)">
  <div class="card shadow-2xl w-[380px]">
    <div class="card-body p-7">
      <div class="text-center">
        <span class="inline-flex items-center justify-center size-11 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 text-white text-base font-extrabold shadow-sm shadow-primary-500/30">QA</span>
        <h1 class="text-lg font-bold tracking-tight mt-3 mb-1">QA 에이전트팀</h1>
        <p class="muted small mb-4">사내 QA 에이전트 콘솔</p>
      </div>

      <!-- 탭: 로그인 / 회원가입 -->
      <div class="flex gap-1 p-1 bg-slate-100 rounded-lg mb-4">
        <button type="button" class="flex-1 h-8 rounded-md text-sm font-semibold transition-colors"
                :class="mode === 'login' ? 'bg-white text-primary-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                @click="setMode('login')">로그인</button>
        <button type="button" class="flex-1 h-8 rounded-md text-sm font-semibold transition-colors"
                :class="mode === 'signup' ? 'bg-white text-primary-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                @click="setMode('signup')">회원가입</button>
      </div>

      <!-- 로그인 -->
      <form v-if="mode === 'login'" @submit.prevent="login" class="space-y-3">
        <div>
          <label class="label">아이디</label>
          <input type="text" class="input" v-model="loginId" placeholder="아이디" autocomplete="username" />
        </div>
        <div>
          <label class="label">비밀번호</label>
          <div class="relative">
            <input :type="showPw ? 'text' : 'password'" class="input pr-10" v-model="password" placeholder="비밀번호" autocomplete="current-password" />
            <button type="button" @click="togglePw"
                    class="absolute inset-y-0 right-0 inline-flex items-center justify-center w-10 text-slate-400 hover:text-slate-600"
                    :aria-label="showPw ? '비밀번호 숨기기' : '비밀번호 표시'">
              <i :data-lucide="showPw ? 'eye-off' : 'eye'" class="size-4"></i>
            </button>
          </div>
        </div>
        <div v-if="error" class="text-red-600 small">{{ error }}</div>
        <button class="btn btn-primary btn-lg w-full" type="submit" :disabled="busy">{{ busy ? '확인 중…' : '로그인' }}</button>
        <p class="small muted text-center pt-1">슈퍼관리자는 전용 아이디(<code class="mono text-xs bg-slate-100 rounded px-1">admin</code>)와 마스터 비밀번호로 로그인합니다.</p>
      </form>

      <!-- 회원가입 -->
      <form v-else @submit.prevent="signup" class="space-y-3">
        <div v-if="suDone" class="rounded-md bg-emerald-50 ring-1 ring-inset ring-emerald-500/20 px-3 py-2.5 text-sm text-emerald-700">
          {{ suDone }}
        </div>
        <template v-else>
          <div>
            <label class="label">이름</label>
            <input type="text" class="input" v-model="su.name" placeholder="홍길동" autocomplete="name" />
          </div>
          <div>
            <label class="label">아이디</label>
            <input type="text" class="input" v-model="su.loginId" placeholder="영문/숫자/._- 4~20자" autocomplete="username" />
          </div>
          <div>
            <label class="label">비밀번호</label>
            <input :type="showPw ? 'text' : 'password'" class="input" v-model="su.password" placeholder="4자 이상" autocomplete="new-password" />
          </div>
          <div>
            <label class="label">연락처 <span class="text-slate-400 font-normal">(선택)</span></label>
            <input type="text" class="input" v-model="su.contact" placeholder="이메일 또는 슬랙" autocomplete="off" />
          </div>
          <div v-if="suError" class="text-red-600 small">{{ suError }}</div>
          <button class="btn btn-primary btn-lg w-full" type="submit" :disabled="busy">{{ busy ? '가입 중…' : '회원가입 신청' }}</button>
          <p class="small muted text-center pt-1">가입 후 슈퍼관리자 승인을 받으면 로그인할 수 있습니다.</p>
        </template>
        <button v-if="suDone" type="button" class="btn btn-outline w-full" @click="setMode('login')">로그인으로</button>
      </form>
    </div>
  </div>
</div>
